<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pesadillas</title>

  <style>
    body {
      margin: 0;
      min-height: 4320px;
      background-image: url(https://i.imgur.com/vmaF3AK.jpeg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 10;
    }

    #cloudBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 90px;
      background: white;
      border: none;
      border-radius: 60px;
      cursor: pointer;
    }

    #cloudBtn span {
      position: relative;
      z-index: 2;
      font-size: 42px;
      font-weight: bold;
    }

    #cloudBtn::before,
    #cloudBtn::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    #cloudBtn::before {
      width: 80px;
      height: 80px;
      top: -35px;
      left: 10px;
    }

    #cloudBtn::after {
      width: 100px;
      height: 100px;
      top: -45px;
      right: 5px;
    }

    #introVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: none;
      z-index: 20;
    }

    #arrow {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
      color: white;
      opacity: 0;
      pointer-events: none;
    }

    main {
      padding-top: 100vh;
    }

    #gallery {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 120px;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 120px;
    }

    .item {
      text-align: center;
      opacity: 0;
      transform: translateY(60px);
      transition: 1s;
    }

    .item img {
      width: 400px;
    }

    .item span {
      display: block;
      margin-top: 14px;
      font-size: 26px;
      letter-spacing: 4px;
      color: white;
    }

    #messagesSection {
      max-width: 1000px;
      margin: 300px auto 200px;
      text-align: center;
      color: white;
    }

    #dream {
      width: 70%;
      height: 150px;
      font-size: 18px;
      padding: 12px;
    }
  </style>
</head>

<body>

<div id="intro">
  <button id="cloudBtn"><span>?</span></button>
  <video id="introVideo" playsinline>
    <source src="https://i.imgur.com/HeQ0etw.mp4" type="video/mp4">
  </video>
</div>

<div id="arrow">⬇</div>

<main>
  <section id="gallery">
    <div class="col">
      <div class="item"><img src="https://i.imgur.com/XLYlG9e.gif"><span>RC</span></div>
      <div class="item"><img src="https://i.imgur.com/LiuwUpZ.gif"><span>MID</span></div>
      <div class="item"><img src="https://i.imgur.com/bV5jLc9.gif"><span>KT</span></div>
      <div class="item"><img src="https://i.imgur.com/hLim0Yv.gif"><span>SR</span></div>
    </div>

    <div class="col">
      <div class="item"><img src="https://i.imgur.com/BBy9tZV.gif"><span>MLS</span></div>
      <div class="item"><img src="https://i.imgur.com/vSc3Exw.gif"><span>CCM</span></div>
      <div class="item"><img src="https://i.imgur.com/iaS9GL0.gif"><span>AFR</span></div>
      <div class="item"><img src="https://i.imgur.com/jspdlXU.gif"><span>HV</span></div>
    </div>
  </section>

  <section id="messagesSection">
    <p>¿Compartes pesadillas?</p>
    <textarea id="dream"></textarea>
    <br><br>
    <button id="send">Enviar</button>
    <div id="messages"></div>
  </section>
</main>

<script>
  const btn = document.getElementById("cloudBtn");
  const video = document.getElementById("introVideo");
  const arrow = document.getElementById("arrow");

  btn.onclick = async () => {
    btn.style.display = "none";
    video.style.display = "block";
    try { await video.play(); }
    catch { video.muted = true; await video.play(); }
  };

  video.onended = () => {
    document.getElementById("intro").style.display = "none";
    arrow.style.opacity = 1;
  };

  window.addEventListener("scroll", () => {
    document.querySelectorAll(".item").forEach(el => {
      if (el.getBoundingClientRect().top < innerHeight - 80) {
        el.style.opacity = 1;
        el.style.transform = "translateY(0)";
      }
    });
  });

  send.onclick = () => {
    if (dream.value.trim()) {
      messages.innerHTML += `<p>${dream.value}</p>`;
      dream.value = "";
    }
  };
</script>

</body>
</html>
